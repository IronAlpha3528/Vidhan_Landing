<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/vortex-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vortex Ventures — From Communities to Culture | Brand Partnerships & Event Experiences</title>
    <meta name="description" content="Vortex Ventures connects forward-thinking brands with campuses, city events, creators, and cultural experiences that move the next generation." />
    <meta name="keywords" content="brand partnerships, campus activations, college festivals, city events, experiential marketing, creator campaigns, Vortex Ventures" />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vortex Ventures — From Communities to Culture" />
    <meta property="og:description" content="We connect brands with the campuses, cities, and communities that move the next generation." />
    
    <!-- Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Instant Flash-Free Theme Initializer -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('vortex-theme');
          var isDark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-vortex-navy-deep text-vortex-navy dark:text-white font-sans antialiased selection:bg-vortex-blue selection:text-white overflow-x-hidden transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
